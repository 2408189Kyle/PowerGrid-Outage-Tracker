<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f8">
    <link rel="manifest" href="manifest.json">
    <title>Log in · PowerGrid Outage Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Auth.css">
</head>
<body class="auth-page">
    <div class="bg-orbs" aria-hidden="true"><i></i><i></i><i></i></div>

    <main class="auth-shell">
        <section class="auth-card" id="auth-card">
            <header class="auth-brand">
                <div class="brand" aria-hidden="true">⚡</div>
                <div>
                    <p class="eyebrow">POWERGRID OUTAGE TRACKER · BATANGAS CITY</p>
                    <h1 id="auth-title">Welcome back</h1>
                </div>
            </header>
            <p class="auth-sub" id="auth-sub">Log in to report outages and follow repairs in your barangay.</p>

            <div class="auth-tabs" role="tablist">
                <button class="auth-tab active" type="button" role="tab" data-mode="login">Log in</button>
                <button class="auth-tab" type="button" role="tab" data-mode="register">Create account</button>
            </div>

            <!-- LOG IN -->
            <form class="auth-panel active" id="login-form" data-mode="login" novalidate>
                <div class="field">
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
                    <small class="field-error"></small>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="pw-wrap">
                        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
                        <button class="pw-toggle" type="button" data-toggle="login-password" aria-label="Show password">Show</button>
                    </div>
                    <small class="field-error"></small>
                </div>
                <label class="check"><input id="login-remember" type="checkbox"> <span>Keep me logged in for 7 days</span></label>
                <p class="form-error" id="login-error" role="alert"></p>
                <button class="primary-button auth-submit" type="submit">Log in</button>

            </form>

            <!-- REGISTER -->
            <form class="auth-panel" id="register-form" data-mode="register" novalidate>
                <div class="field">
                    <label for="reg-name">Full name</label>
                    <input id="reg-name" name="name" type="text" autocomplete="name" placeholder="Juan Dela Cruz" required>
                    <small class="field-error"></small>
                </div>
                <div class="field">
                    <label for="reg-email">Email</label>
                    <input id="reg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    <small class="field-error"></small>
                </div>
                <div class="field">
                    <label for="reg-barangay">Your barangay</label>
                    <select id="reg-barangay" name="barangay" required>
                        <option value="" disabled selected>Choose a barangay</option>
                    </select>
                    <small class="field-error"></small>
                </div>
                <div class="field">
                    <label for="reg-password">Password</label>
                    <div class="pw-wrap">
                        <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters, with a number" required>
                        <button class="pw-toggle" type="button" data-toggle="reg-password" aria-label="Show password">Show</button>
                    </div>
                    <div class="strength" id="strength" data-level="0" aria-hidden="true"><i></i><i></i><i></i><i></i><span id="strength-label"></span></div>
                    <small class="field-error"></small>
                </div>
                <div class="field">
                    <label for="reg-confirm">Confirm password</label>
                    <div class="pw-wrap">
                        <input id="reg-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Type it again" required>
                        <button class="pw-toggle" type="button" data-toggle="reg-confirm" aria-label="Show password">Show</button>
                    </div>
                    <small class="field-error"></small>
                </div>
                <p class="form-error" id="register-error" role="alert"></p>
                <button class="primary-button auth-submit" type="submit">Create account</button>
            </form>

            <p class="auth-note">Accounts are managed by the PowerGrid server.</p>
            <p class="auth-footer">PowerGrid staff? <a href="StaffLogin.html">Staff sign in</a></p>
        </section>
    </main>

    <script src="Auth.js"></script>
    <script src="Login.js"></script>
</body>
</html>
